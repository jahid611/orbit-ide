<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="
				default-src
					'none'
				;
				img-src
					'self'
					data:
					blob:
					vscode-remote-resource:
					vscode-managed-remote-resource:
					https:
				;
				media-src
					'self'
				;
				frame-src
					'self'
					vscode-webview:
				;
				script-src
					'self'
					'unsafe-eval'
					blob:
					'nonce-0c6a828f1297'
				;
				style-src
					'self'
					'unsafe-inline'
				;
				connect-src
					'self'
					https:
					ws:
					http://localhost:*
					http://127.0.0.1:*
				;
				font-src
					'self'
					vscode-remote-resource:
					vscode-managed-remote-resource:
					https://*.vscode-unpkg.net
				;
				require-trusted-types-for
					'script'
				;
				trusted-types
					vscode-bootstrapImportMap
					amdLoader
					cellRendererEditorText
					collapsedCellPreview
					defaultWorkerFactory
					diffEditorWidget
					diffReview
					domLineBreaksComputer
					dompurify
					lit-html
					editorGhostText
					editorViewLayer
					htmlToMarkdown
					notebookRenderer
					stickyScrollViewLayer
					tokenizeToString
					notebookChatEditController
					richScreenReaderContent
					chatDebugTokenizer
				;
		"/>

		<!-- Orbit launch screen (removed by workbench/contrib/orbit once the workbench has restored) -->
		<style id="orbit-splash-style">
			#orbit-splash { position: fixed; inset: 0; z-index: 2147483000; overflow: hidden; background: #05040d; font-family: -apple-system, 'SF Pro Display', 'Segoe UI Variable Display', system-ui, sans-serif; -webkit-app-region: drag; transition: opacity .7s ease, transform .9s cubic-bezier(.4,0,.2,1), filter .7s ease; animation: orbitSplashFailsafe .6s ease 12s forwards; }
			#orbit-splash.orbit-splash-out { opacity: 0; transform: scale(1.04); filter: blur(6px); pointer-events: none; }
			/* The planet in motion is a Higgsfield video; the brand and progress stay crisp HTML on top of it. */
			#orbit-splash video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
			#orbit-splash .veil { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 38%, rgba(5,4,13,.6) 100%); }
			#orbit-splash .brand { position: absolute; left: 0; right: 0; bottom: 104px; display: flex; flex-direction: column; align-items: center; filter: drop-shadow(0 2px 18px rgba(5,4,13,.9)); }
			#orbit-splash .word { font-size: 44px; font-weight: 650; letter-spacing: .02em; color: transparent; background: linear-gradient(90deg, #a99bff, #fff 45%, #7ff0de 70%, #a99bff); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; animation: orbitWordIn 1.1s cubic-bezier(.16,1,.3,1) .55s both, orbitGradient 4s linear 1.6s infinite; }
			#orbit-splash .tag { margin-top: 8px; font-size: 13px; letter-spacing: .32em; text-transform: uppercase; color: rgba(205,198,255,.55); animation: orbitFadeUp .9s ease .9s both; }
			#orbit-splash .bar { position: absolute; bottom: 64px; width: 180px; height: 2px; border-radius: 2px; overflow: hidden; background: rgba(255,255,255,.08); animation: orbitFadeUp .6s ease 1s both; }
			#orbit-splash .bar::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: 2px; background: linear-gradient(90deg, transparent, #8b7bff, #6ff5df, transparent); animation: orbitLoad 1.3s ease-in-out infinite; }
			@keyframes orbitWordIn { from { opacity: 0; letter-spacing: .6em; filter: blur(10px); transform: translateY(10px); } to { opacity: 1; } }
			@keyframes orbitGradient { to { background-position: -220% 0; } }
			@keyframes orbitFadeUp { from { opacity: 0; transform: translateY(8px); } }
			@keyframes orbitLoad { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
			@keyframes orbitSplashFailsafe { to { opacity: 0; visibility: hidden; } }
			#orbit-splash .foot { position: absolute; left: 0; right: 0; bottom: 64px; display: flex; justify-content: center; }
			#orbit-splash .foot .bar { position: relative; bottom: auto; }
			@media (prefers-reduced-motion: reduce) { #orbit-splash *, #orbit-splash *::before, #orbit-splash *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; } }
		</style>
	</head>

	<body aria-label="">
		<div id="orbit-splash" aria-hidden="true">
			<video autoplay muted playsinline preload="auto"><source src="../../../workbench/contrib/orbit/browser/media/splash.webm" type="video/webm"><source src="../../../workbench/contrib/orbit/browser/media/splash.mp4" type="video/mp4"></video>
			<div class="veil"></div>
			<div class="brand"><div class="word">Orbit</div><div class="tag">Claude · Code · Terminal</div></div>
			<div class="foot"><div class="bar"></div></div>
		</div>
	</body>

	<!-- Startup (do not modify order of script tags!) -->
	<script src="./workbench.js" type="module"></script>
</html>
