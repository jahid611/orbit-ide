			#orbit-splash .shine { position: absolute; width: 260px; height: 260px; border-radius: 50%; overflow: hidden; -webkit-mask-image: radial-gradient(circle, #000 34%, transparent 36%); mask-image: radial-gradient(circle, #000 34%, transparent 36%); }
			#orbit-splash .shine::after { content: ''; position: absolute; top: -50%; left: -120%; width: 60%; height: 200%; transform: rotate(24deg); background: linear-gradient(90deg, transparent, rgba(255,255,255,.38), transparent); animation: orbitShine 2.6s ease-in-out 1.1s infinite; }
			#orbit-splash .ring { position: absolute; width: 420px; height: 420px; border-radius: 50%; border: 1px solid rgba(180,165,255,.22); transform: rotateX(72deg) rotateZ(-28deg); animation: orbitRingIn 1.4s ease-out .3s both; }
			#orbit-splash .ring::before { content: ''; position: absolute; inset: 0; border-radius: 50%; animation: orbitSpin 3.4s linear infinite; }
			#orbit-splash .ring::after { content: ''; position: absolute; top: -5px; left: calc(50% - 5px); width: 10px; height: 10px; border-radius: 50%; background: #6ff5df; box-shadow: 0 0 14px 4px rgba(94,234,212,.75); transform-origin: 5px 215px; animation: orbitSpin 3.4s linear infinite; }
			#orbit-splash .ring.r2 { width: 520px; height: 520px; border-color: rgba(180,165,255,.1); transform: rotateX(74deg) rotateZ(18deg); animation-delay: .5s; }
			#orbit-splash .ring.r2::after { width: 6px; height: 6px; left: calc(50% - 3px); top: -3px; background: #c4b5fd; box-shadow: 0 0 10px 3px rgba(167,139,250,.7); transform-origin: 3px 263px; animation-duration: 5.5s; animation-direction: reverse; }
			#orbit-splash .word { margin-top: 34px; font-size: 44px; font-weight: 650; letter-spacing: .02em; color: transparent; background: linear-gradient(90deg, #a99bff, #fff 45%, #7ff0de 70%, #a99bff); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; animation: orbitWordIn 1.1s cubic-bezier(.16,1,.3,1) .55s both, orbitGradient 4s linear 1.6s infinite; }
			#orbit-splash .tag { margin-top: 8px; font-size: 13px; letter-spacing: .32em; text-transform: uppercase; color: rgba(205,198,255,.55); animation: orbitFadeUp .9s ease .9s both; }
			#orbit-splash .bar { position: absolute; bottom: 64px; width: 180px; height: 2px; border-radius: 2px; overflow: hidden; background: rgba(255,255,255,.08); animation: orbitFadeUp .6s ease 1s both; }
			#orbit-splash .bar::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: 2px; background: linear-gradient(90deg, transparent, #8b7bff, #6ff5df, transparent); animation: orbitLoad 1.3s ease-in-out infinite; }
			@keyframes orbitLogoIn { from { opacity: 0; transform: scale(.55) rotate(-25deg); filter: blur(18px) brightness(2.2); } 60% { filter: blur(0) brightness(1.25); } to { opacity: 1; transform: none; filter: none; } }
			@keyframes orbitHaloIn { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: none; } }
			@keyframes orbitBreath { 50% { opacity: .65; transform: scale(1.08); } }
