# Builds Orbit's installers and attaches them to a GitHub release.
# Runs when a tag `v<version>` is pushed (the version is `orbitVersion` in product.json), or by hand.
# Orbit looks at the latest release to offer updates (extensions/orbit/src/update.ts): the Windows
# installer must keep the name OrbitSetup-x64-<version>.exe.
name: Orbit release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orbit-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: version
        run: |
          version=$(node -p "require('./product.json').orbitVersion")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "The tag ${GITHUB_REF_NAME} does not match orbitVersion $version in product.json" >&2
            exit 1
          fi
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1 || gh release create "${{ steps.version.outputs.tag }}" --draft --target "${GITHUB_SHA}" --title "Orbit ${{ steps.version.outputs.version }}" --notes-file .github/orbit-release-notes.md

  windows:
    name: Windows x64
    needs: release
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      NPM_ARCH: x64
      VSCODE_ARCH: x64
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        shell: pwsh
        env:
          npm_config_arch: x64
          GITHUB_TOKEN: ${{ github.token }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: |
          node build/npm/preinstall.ts
          if ($LASTEXITCODE -ne 0) { throw "preinstall failed" }
          for ($i = 1; $i -le 4; $i++) {
            npm ci
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 4) { throw "npm ci failed" }
            Start-Sleep -Seconds 5
          }
      - name: Build Orbit
        shell: pwsh
        run: |
          # The very last step signs the executables and needs a certificate: the application is
          # complete before it, so what counts is that Orbit.exe is there.
          npm run gulp vscode-win32-x64-min
          if (-not (Test-Path ..\VSCode-win32-x64\Orbit.exe)) { throw "The build did not produce Orbit.exe" }
      - name: Build the installer
        shell: pwsh
        run: |
          npm run gulp vscode-win32-x64-inno-updater
          if ($LASTEXITCODE -ne 0) { throw "inno updater failed" }
          npm run gulp vscode-win32-x64-user-setup
          if ($LASTEXITCODE -ne 0) { throw "installer failed" }
          Move-Item .build\win32-x64\user-setup\OrbitSetup.exe "OrbitSetup-x64-${{ needs.release.outputs.version }}.exe"
      - name: Attach to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release.outputs.tag }}" "OrbitSetup-x64-${{ needs.release.outputs.version }}.exe" --clobber

  macos:
    name: macOS Apple Silicon
    needs: release
    runs-on: macos-14
    timeout-minutes: 120
    env:
      NPM_ARCH: arm64
      VSCODE_ARCH: arm64
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        env:
          npm_config_arch: arm64
          GITHUB_TOKEN: ${{ github.token }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: |
          set -e
          python3 -m pip install --break-system-packages setuptools
          for i in 1 2 3 4; do
            npm ci && break
            if [ "$i" = 4 ]; then exit 1; fi
            sleep 5
          done
      - name: Build Orbit
        run: |
          npm run gulp vscode-darwin-arm64-min
          test -d ../VSCode-darwin-arm64/Orbit.app
      - name: Package
        run: |
          # No Apple developer certificate: the application is signed « ad hoc », which lets it run
          # on Apple Silicon. macOS still asks the user to allow it the first time (see the README).
          codesign --force --deep -s - ../VSCode-darwin-arm64/Orbit.app
          ditto -c -k --sequesterRsrc --keepParent ../VSCode-darwin-arm64/Orbit.app "Orbit-mac-arm64-${{ needs.release.outputs.version }}.zip"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release.outputs.tag }}" "Orbit-mac-arm64-${{ needs.release.outputs.version }}.zip" --clobber
